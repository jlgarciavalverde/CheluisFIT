version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: cheluisfit-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123 # Cambia esto en producción
      POSTGRES_DB: cheluisfit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
