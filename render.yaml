services:
  - type: web
    name: cheluisfit-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run db:generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: JWT_TTL
        value: 7d
      - key: JSON_BODY_LIMIT
        value: 100kb
      - key: RATE_LIMIT_GENERAL_MAX
        value: "1000"
      - key: RATE_LIMIT_AUTH_MAX
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
